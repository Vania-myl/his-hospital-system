server:
  port: 8080

spring:
  application:
    name: his-backend
  datasource:
    # TODO 改成本机 MySQL root 密码
    url: jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.his.entity
  configuration:
    # 数据库 snake_case 自动映射为 Java 驼峰
    map-underscore-to-camel-case: true

logging:
  level:
    com.his.mapper: debug
